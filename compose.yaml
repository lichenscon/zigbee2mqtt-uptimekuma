version: "3.8"

services:
  zigbee-kuma-sync:
    build: .
    container_name: zigbee-kuma-sync
    restart: unless-stopped
    environment:
      - MQTT_BROKER=192.168.1.50                    # IP/Hostname deines MQTT-Brokers (ohne mqtt://)
      - MQTT_PORT=1883
      - MQTT_USER=                                  # Optional
      - MQTT_PASSWORD=                              # Optional
      - ZIGBEE2MQTT_BASE_TOPIC=zigbee2mqtt
      - POLL_INTERVAL=60                            # Wie oft die App aktiv neue Bridge-Daten anfragt (Sekunden)
      - UPTIME_KUMA_URL=http://uptime-kuma:3001
      - UPTIME_KUMA_USER=dein_admin_user
      - UPTIME_KUMA_PASS=dein_admin_passwort
      - PUBLIC_APP_URL=http://zigbee-kuma-sync:5000   # Erreichbarkeit dieses Flask-Services für Uptime Kuma
      - ONLINE_GROUP_NAME=Zigbee Online Status      # Name der einklappbaren Gruppe für Online-Status
      - BATTERY_GROUP_NAME=Zigbee Batteriestand     # Name der einklappbaren Gruppe für Batteriestand
      - BATTERY_THRESHOLD=20                        # Standard-Schwellenwert für Batteriewarnungen (%)
      - MONITOR_INTERVAL=60                         # Abfrage-Intervall für Uptime Kuma Monitore in Sekunden
      - NOTIFICATION_NAME=Telegram Bot              # Name des Benachrichtigungs-Kanals in Uptime Kuma (leer lassen, falls keine Standard-Benachrichtigung gewünscht)
      - DEBUG=true
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    networks:
      - default